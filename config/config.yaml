platform:
  tau_tech: 0.75  # The platform's detector level. The higher the value, the higher the accuracy.
  steep: 6  # (Pressure sensitivity adjustment factor): It determines the steepness of the `tanh` curve, which is the platform's "sensitivity" to pressure.
  eta: 0.1  # Determines the maximum magnitude of each adjustment step.
  mu: 5  # Base influence unit price. Responsible for monetizing abstract "influence points" so they can be compared with regulatory costs in the same dimension.
  w: 1.0  # The platform's user churn aversion coefficient >1: afraid of user churn. <1: afraid of government punishment.

  kpi_window_size: 3  # KPI window size
  import_policy_day_time: 3  # The start time for importing policies.

  dissatisfaction_per_fp: 1.0  # Dissatisfaction points generated by each false positive
#  dissatisfaction_decay_rate: 0.2  # Daily dissatisfaction retention rate -> low granularity
  dissatisfaction_decay_rate: 0.8  # Daily dissatisfaction retention rate -> high granularity
  dissatisfaction_to_churn_cost_factor: 1  # Factor for converting accumulated dissatisfaction value into potential user churn cost

  simple_batch_size: 3  # In the simplified framework, the quantity processed in one batch

  simple_run_days: 15  # Simplified framework operation days.
  complete_run_days: 15  # Complete framework operation days.

  post_wish_threshold: -1.6  # When the agent's satisfaction with the platform is lower than this threshold, it no longer wants to post content / higher than this threshold, it starts posting content
  is_active_threshold: -1.8  # When the agent's satisfaction with the platform is lower than this threshold, it leaves the platform

  case_validation: False  # Whether to enable case validation
  efficiency_validation: False  # Whether to enable efficiency validation
  ablation_validation: False  # Whether to enable ablation validation



nsga:
  population_size: 10  # NSGA algorithm initial population size
  generations: 1  # NSGA iteration rounds

public_agent:
  number_of_interactions: 4  # After the agent browses content, if the number of interactions reaches this limit, it ends browsing.
  number_of_compressions: 5  # In the agent react process, when messages accumulate to this number, message compression is triggered
  number_of_keep: 4  # In the agent react process, the number of messages kept after message compression

file_load_path:
  contents_file: "method/data/contents.json"  # Content file
  watermark_file: "method/data/watermarking_technology_to_combat_databases-2.json"  # Watermark file
  personas_file: "method/data/personas_30.json"
  token_file: "method/store/token/all_token.csv"  # Used to store the number of tokens consumed during operation
  chroma_db_file: "method/store/chroma_db"  # Directory used to store chroma database
  daily_memory_exports_file: "method/store/daily_memory_exports"  # Directory used to store daily exported memories

model:
  public_scan_model: "qwen-flash"  # Content browsing model
  public_summarize_model: "qwen-plus"  # Content summarization model
  creator_model: "qwen-plus"  # Creator driving model
  platform_model: "qwen-plus"  # Platform model
  compression_memory_model: "qwen-flash"  # Message compression model
  simple_model: "qwen-flash"  # Model driven by the simplified framework
  dialogue_history_model: "qwen-flash"  # Dialogue history summarization model

llm_key:
  qwen: "key1"  # Which key to select
  single_key_concurrency_num: 3  # Single key concurrency number